aid: fearn
name: Fearn
description: >-
  Fearn is the AI-native patent prosecution firm built for startups. It pairs former
  Big Law patent attorneys with proprietary, hallucination-resistant AI models built
  in-house by PhD computer scientists to take an invention from disclosure to a
  filing-ready provisional or non-provisional patent draft in minutes rather than the
  50+ hours typical of traditional firms, at flat-rate pricing with automated
  labeled-figure generation and a money-back guarantee tied to claim allowance. Fearn
  self-hosts its entire AI infrastructure and uses no third-party model APIs, keeping
  invention disclosures confidential and compliant with SOC 2, ISO 27001, ISO 27701,
  and GDPR. Founded in 2025 and headquartered in San Francisco; backed by Kindred
  Ventures and a16z speedrun. Fearn is a legal-services company and does not currently
  publish a public developer API.
